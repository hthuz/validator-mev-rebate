[project]
name = "validator-mev-rebate"
version = "0.1.0"
description = "Validator MEV Rebate Platform - Sandwich attack detection and mitigation"
authors = [
    {name = "hthuz", email = "hthuz@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=2.3.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests", "app/tests", "mitigation/tests", "sandwich/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
