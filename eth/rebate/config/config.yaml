server:
  port: 8080

simulator:
  mode: replay
  dataset_path: data/ethereum_transactions.csv
  block_interval_seconds: 2
  block_gas_limit: 30000000

reporting:
  experiment_dir: logs/experiment

# 注册到分发器的 builder 节点
# score 是 0-100 的百分制基础分。运行时会基于分发成功率、价值产出、well-behaved 事件、
# sandwich 攻击报告等行为信号，动态调整实际分发权重。
dispatcher:
  strategy:
    exploration_enabled: true
    exploration_rate: 0.20
    min_explore_dispatches: 5
    new_producer_grace_period: 600s
    uncertainty_weight: 1.25
    fresh_producer_bonus: 0.75
  builders:
    - name: builder-alpha
      url: http://localhost:18545
      score: 100
    - name: builder-beta
      url: http://localhost:18546
      score: 33

# 本地启动的 mock builder 节点（仅用于开发/测试）
mock_builders:
  - name: builder-alpha
    addr: :18545
  - name: builder-beta
    addr: :18546
