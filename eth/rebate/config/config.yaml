server:
  port: 8080

simulator:
  mode: replay
  dataset_path: data/ethereum_transactions.csv
  block_interval_seconds: 2
  block_gas_limit: 30000000

# 注册到分发器的 builder 节点
# score 是基础分。运行时会基于分发成功率、价值产出、well-behaved 事件、
# sandwich 攻击报告等行为信号，动态调整实际分发权重。
dispatcher:
  exploration:
    enabled: true
    rate: 0.20
    min_explore_dispatches: 5
    new_producer_age_seconds: 600
    uncertainty_weight: 1.25
    fresh_producer_bonus: 0.75
  builders:
    - name: builder-alpha
      url: http://localhost:18545
      score: 3.0
    - name: builder-beta
      url: http://localhost:18546
      score: 1.0

# 本地启动的 mock builder 节点（仅用于开发/测试）
mock_builders:
  - name: builder-alpha
    addr: :18545
  - name: builder-beta
    addr: :18546
